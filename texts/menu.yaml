help_text: |
  🗺️ Экспедиции HueKrads

  /adventure — выбрать локацию и отправить гнома (⚒ КУЗНЯ и здесь)
  /adventure_name — назвать гнома (один раз навсегда)
  /adventure_equipment — снаряжение гнома (надеть/снять вещи)
  /adventure_stats — статистика
  /adventure_inventory — инвентарь (фрукты здесь можно съесть)
  /adventure_huecrab — карточка хуекраба
  /adventure_saray — сарай хуекрабов (кто где живёт, смена напарника)
  /adventure_huecrab_name — назвать хуекраба (имя можно давать один раз)
